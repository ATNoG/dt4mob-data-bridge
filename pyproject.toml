[project]
name = "Data_Bridge"
version = "0.1.0"
requires-python = ">=3.13.5"
dependencies = [
  "pydantic>=2.11.7",
  "pydantic-settings>=2.8.1",
  "aiohttp",
  "loguru",
  "fastapi[standard]>=0.116.1",
  "geopy>=2.4.1",
  "fastapi-utils>=0.8.0",
  "typing-inspect>=0.9.0",
  "pyproj>=3.7.2",
  "asyncio>=4.0.0",
  "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "ruff>=0.12.5",
    "ty>=0.0.1a16",
    "pre-commit>=4.5.1",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["T20"]
